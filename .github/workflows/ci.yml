name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores ficticios: el build no se conecta a Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-key
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (unitarios + integración con Postgres)
        run: npm test

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high

  # Verifica que las migraciones de supabase/migrations se apliquen desde cero
  # sobre una base Supabase vacía, que no tengan errores de lint y que los tipos
  # de lib/types/supabase.ts estén generados desde ese mismo esquema.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Levantar Postgres de Supabase y aplicar migraciones
        run: supabase db start

      - name: Lint del esquema
        run: supabase db lint --local --level error --fail-on error

      - name: Tipos al día con las migraciones
        run: |
          supabase gen types typescript --local > /tmp/supabase.ts
          if ! diff -u lib/types/supabase.ts /tmp/supabase.ts; then
            echo "::error::lib/types/supabase.ts no coincide con las migraciones. Corré 'npm run db:types' y commiteá el resultado."
            exit 1
          fi
