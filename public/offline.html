<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e3a8a">
  <title>Sin conexión — Usina de Justicia</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; }
    main { max-width: 420px; padding: 32px 24px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.25rem; margin: 20px 0 8px; }
    p { color: #475569; line-height: 1.5; margin: 0 0 24px; }
    button { background: #1e3a8a; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Sin conexión</h1>
    <p>La base de datos necesita internet. Por seguridad, los datos de los casos no se guardan en este dispositivo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
